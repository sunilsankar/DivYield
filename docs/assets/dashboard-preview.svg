<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0f172a; snip font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;snip ">
  <!-- Window Header -->
  <rect x="0" y="0" width="1000" height="40" fill="#1e293b" rx="8" />
  <circle cx="24" cy="20" r="6" fill="#ef4444" />
  <circle cx="44" cy="20" r="6" fill="#f59e0b" />
  <circle cx="64" cy="20" r="6" fill="#10b981" />
  <text x="500" y="25" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">DivYield — Portfolio &snip amp; snip Dividend Tracker</text>
  
  <!-- Navigation Bar -->
  <rect x="0" y="40" width="1000" height="56" fill="#0f172a" />
  <line x1="0" y1="96" x2="1000" y2="96" stroke="#334155" stroke-width="1" />
  <text x="32" y="74" fill="#38bdf8" font-size="18" font-weight="bold">DivYield</text>
  
  <!-- Nav items -->
  <rect x="130" y="54" width="92" height="28" rx="6" fill="#1e293b" />
  <text x="176" y="73" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">Dashboard</text>
  <text x="260" y="73" fill="#94a3b8" font-size="13" font-weight="500">Holdings</text>
  <text x="340" y="73" fill="#94a3b8" font-size="13" font-weight="500">Dividends</text>
  <text x="425" y="73" fill="#94a3b8" font-size="13" font-weight="500">Calendar</text>
  <text x="505" y="73" fill="#94a3b8" font-size="13" font-weight="500">Diversification</text>
  <text x="605" y="73" fill="#94a3b8" font-size="13" font-weight="500">Tax (Box 3)</text>
  <text x="695" y="73" fill="#94a3b8" font-size="13" font-weight="500">Settings</text>
  
  <!-- Lock & snip Sync buttons -->
  <rect x="820" y="54" width="64" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="852" y="73" fill="#cbd5e1" font-size="12" font-weight="500" text-anchor="middle">🔒 Lock</text>
  <rect x="894" y="54" width="80" height="28" rx="6" fill="#0284c7" />
  <text x="934" y="73" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Sync Now</text>

  <!-- Metric Cards -->
  <g transform="translate(32, 116)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="218" height="94" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="16" y="28" fill="#94a3b8" font-size="12" font-weight="500">TOTAL PORTFOLIO</text>
    <text x="16" y="58" fill="#f8fafc" font-size="24" font-weight="bold">€42,850.40</text>
    <text x="16" y="78" fill="#10b981" font-size="12" font-weight="600">+€4,120.30 (+10.6%)</text>

    <!-- Card 2 -->
    <rect x="238" y="0" width="218" height="94" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="254" y="28" fill="#94a3b8" font-size="12" font-weight="500">ANNUAL DIVIDENDS</text>
    <text x="254" y="58" fill="#38bdf8" font-size="24" font-weight="bold">€1,745.20</text>
    <text x="254" y="78" fill="#94a3b8" font-size="12">Avg. €145.43 / month</text>

    <!-- Card 3 -->
    <rect x="476" y="0" width="218" height="94" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="492" y="28" fill="#94a3b8" font-size="12" font-weight="500">DIVIDEND YIELD</text>
    <text x="492" y="58" fill="#a855f7" font-size="24" font-weight="bold">4.07%</text>
    <text x="492" y="78" fill="#94a3b8" font-size="12">Weighted net forward</text>

    <!-- Card 4 -->
    <rect x="714" y="0" width="222" height="94" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="730" y="28" fill="#94a3b8" font-size="12" font-weight="500">UNINVESTED CASH</text>
    <text x="730" y="58" fill="#f59e0b" font-size="24" font-weight="bold">€2,410.15</text>
    <text x="730" y="78" fill="#10b981" font-size="12">Interest: 3.25% AER</text>
  </g>

  <!-- Dividend Bar Chart Card -->
  <rect x="32" y="230" width="570" height="340" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="52" y="262" fill="#f8fafc" font-size="16" font-weight="600">Monthly Dividend Income (12-Month Outlook)</text>
  <text x="52" y="282" fill="#94a3b8" font-size="12">Actual received payouts vs. projected forward dividends</text>
  
  <!-- Legend -->
  <circle cx="450" cy="260" r="5" fill="#10b981" />
  <text x="462" y="264" fill="#94a3b8" font-size="11">Received</text>
  <circle cx="525" cy="260" r="5" fill="#38bdf8" />
  <text x="537" y="264" fill="#94a3b8" font-size="11">Forecast</text>

  <!-- Bars (12 months) -->
  <g transform="translate(52, 510)">
    <!-- Grid line -->
    <line x1="0" y1="-180" x2="530" y2="-180" stroke="#334155" stroke-dasharray="4" />
    <line x1="0" y1="-90" x2="530" y2="-90" stroke="#334155" stroke-dasharray="4" />
    <line x1="0" y1="0" x2="530" y2="0" stroke="#475569" stroke-width="1" />

    <!-- Jan --> <rect x="10" y="-120" width="28" height="120" fill="#10b981" rx="3" /><text x="24" y="18" fill="#64748b" font-size="11" text-anchor="middle">Jan</text>
    <!-- Feb --> <rect x="54" y="-85" width="28" height="85" fill="#10b981" rx="3" /><text x="68" y="18" fill="#64748b" font-size="11" text-anchor="middle">Feb</text>
    <!-- Mar --> <rect x="98" y="-175" width="28" height="175" fill="#10b981" rx="3" /><text x="112" y="18" fill="#64748b" font-size="11" text-anchor="middle">Mar</text>
    <!-- Apr --> <rect x="142" y="-110" width="28" height="110" fill="#10b981" rx="3" /><text x="156" y="18" fill="#64748b" font-size="11" text-anchor="middle">Apr</text>
    <!-- May --> <rect x="186" y="-95" width="28" height="95" fill="#10b981" rx="3" /><text x="200" y="18" fill="#64748b" font-size="11" text-anchor="middle">May</text>
    <!-- Jun --> <rect x="230" y="-160" width="28" height="160" fill="#10b981" rx="3" /><text x="244" y="18" fill="#64748b" font-size="11" text-anchor="middle">Jun</text>
    <!-- Jul --> <rect x="274" y="-130" width="28" height="130" fill="#10b981" rx="3" /><text x="288" y="18" fill="#64748b" font-size="11" text-anchor="middle">Jul</text>
    <!-- Aug --> <rect x="318" y="-90" width="28" height="90" fill="#10b981" rx="3" /><text x="332" y="18" fill="#64748b" font-size="11" text-anchor="middle">Aug</text>
    <!-- Sep --> <rect x="362" y="-180" width="28" height="180" fill="#10b981" rx="3" /><text x="376" y="18" fill="#64748b" font-size="11" text-anchor="middle">Sep</text>
    <!-- Oct (Current) --> <rect x="406" y="-140" width="28" height="140" fill="#38bdf8" rx="3" /><text x="420" y="18" fill="#38bdf8" font-weight="bold" font-size="11" text-anchor="middle">Oct</text>
    <!-- Nov --> <rect x="450" y="-105" width="28" height="105" fill="#38bdf8" rx="3" opacity="0.8" /><text x="464" y="18" fill="#64748b" font-size="11" text-anchor="middle">Nov</text>
    <!-- Dec --> <rect x="494" y="-195" width="28" height="195" fill="#38bdf8" rx="3" opacity="0.8" /><text x="508" y="18" fill="#64748b" font-size="11" text-anchor="middle">Dec</text>
  </g>

  <!-- Top Positions Card -->
  <rect x="622" y="230" width="346" height="340" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="642" y="262" fill="#f8fafc" font-size="16" font-weight="600">Top Dividend Payers</text>
  <text x="642" y="282" fill="#94a3b8" font-size="12">Highest annual dividend income contributors</text>
  
  <g transform="translate(642, 304)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="306" height="52" rx="8" fill="#0f172a" />
    <text x="14" y="24" fill="#f8fafc" font-weight="bold" font-size="13">ASML</text>
    <text x="14" y="40" fill="#64748b" font-size="11">Semiconductors • 18 sh</text>
    <text x="292" y="24" fill="#10b981" font-weight="bold" font-size="13" text-anchor="end">€315.00/yr</text>
    <text x="292" y="40" fill="#94a3b8" font-size="11" text-anchor="end">18.1% of total</text>

    <!-- Row 2 -->
    <rect x="0" y="60" width="306" height="52" rx="8" fill="#0f172a" />
    <text x="14" y="84" fill="#f8fafc" font-weight="bold" font-size="13">INGA</text>
    <text x="14" y="100" fill="#64748b" font-size="11">Financial Services • 240 sh</text>
    <text x="292" y="84" fill="#10b981" font-weight="bold" font-size="13" text-anchor="end">€254.40/yr</text>
    <text x="292" y="100" fill="#94a3b8" font-size="11" text-anchor="end">14.6% of total</text>

    <!-- Row 3 -->
    <rect x="0" y="120" width="306" height="52" rx="8" fill="#0f172a" />
    <text x="14" y="144" fill="#f8fafc" font-weight="bold" font-size="13">UNA</text>
    <text x="14" y="160" fill="#64748b" font-size="11">Consumer Staples • 110 sh</text>
    <text x="292" y="144" fill="#10b981" font-weight="bold" font-size="13" text-anchor="end">€192.50/yr</text>
    <text x="292" y="160" fill="#94a3b8" font-size="11" text-anchor="end">11.0% of total</text>

    <!-- Row 4 -->
    <rect x="0" y="180" width="306" height="52" rx="8" fill="#0f172a" />
    <text x="14" y="204" fill="#f8fafc" font-weight="bold" font-size="13">JNJ</text>
    <text x="14" y="220" fill="#64748b" font-size="11">Healthcare • 35 sh</text>
    <text x="292" y="204" fill="#10b981" font-weight="bold" font-size="13" text-anchor="end">€152.80/yr</text>
    <text x="292" y="220" fill="#94a3b8" font-size="11" text-anchor="end">8.8% of total</text>
  </g>
</svg>