<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0f172a; snip font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;snip ">
  <!-- Phone 1: Modern Material 3 UI -->
  <g transform="translate(80, 30)">
    <rect x="0" y="0" width="280" height="540" rx="32" fill="#020617" stroke="#475569" stroke-width="3" />
    <rect x="90" y="12" width="100" height="14" rx="7" fill="#1e293b" />
    
    <!-- Phone Content Area -->
