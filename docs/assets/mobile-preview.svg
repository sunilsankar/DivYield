    <!-- Push Notification Banner on Top of Screen -->
    <rect x="16" y="88" width="248" height="62" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="36" cy="118" r="12" fill="#0284c7" />
    <text x="36" y="123" fill="#ffffff" font-size="12" text-anchor="middle">🔔</text>
    <text x="58" y="110" fill="#38bdf8" font-size="11" font-weight="bold">Upcoming Dividend Payout</text>
