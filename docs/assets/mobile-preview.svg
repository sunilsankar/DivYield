    <text x="30" y="116" fill="#52525b" font-size="10" font-weight="bold">TOTAL DIVIDENDS (SKETCH)</text>
    <text x="30" y="142" fill="#18181b" font-size="20" font-weight="900">€1,745.20</text>
    <text x="30" y="160" fill="#059669" font-size="11" font-weight="bold">+8.4% YOY Growth</text>

    <!-- Sketch Sector Allocation -->
