    <text x="58" y="142" fill="#64748b" font-size="9">Scheduled local notification (9:00 AM)</text>

    <!-- Card -->
    <rect x="16" y="160" width="248" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="30" y="182" fill="#94a3b8" font-size="10">PORTFOLIO VALUE</text>
    <text x="30" y="206" fill="#f8fafc" font-size="18" font-weight="bold">€42,850.40</text>
    <text x="30" y="224" fill="#10b981" font-size="10" font-weight="600">+€4,120.30 (+10.6%)</text>

    <!-- Holdings list sample -->
    <rect x="16" y="246" width="248" height="44" rx="8" fill="#1e293b" />
    <text x="28" y="266" fill="#f8fafc" font-size="12" font-weight="bold">ASML</text>
    <text x="28" y="280" fill="#64748b" font-size="9">Semis • 18 sh</text>
    <text x="250" y="266" fill="#10b981" font-size="12" font-weight="bold" text-anchor="end">€315.00/yr</text>

    <rect x="16" y="298" width="248" height="44" rx="8" fill="#1e293b" />
    <text x="28" y="318" fill="#f8fafc" font-size="12" font-weight="bold">INGA</text>
    <text x="28" y="332" fill="#64748b" font-size="9">Finance • 240 sh</text>
    <text x="250" y="318" fill="#10b981" font-size="12" font-weight="bold" text-anchor="end">€254.40/yr</text>

    <!-- Bottom Nav -->
    <rect x="8" y="474" width="264" height="50" fill="#020617" />
    <text x="35" y="504" fill="#38bdf8" font-size="10" text-anchor="middle">📊 Home</text>
    <text x="88" y="504" fill="#64748b" font-size="10" text-anchor="middle">💼 Assets</text>
    <text x="140" y="504" fill="#64748b" font-size="10" text-anchor="middle">📅 Calendar</text>
    <text x="194" y="504" fill="#64748b" font-size="10" text-anchor="middle">🌐 Sectors</text>
    <text x="245" y="504" fill="#64748b" font-size="10" text-anchor="middle">⚙️ Setup</text>
  </g>

  <!-- Phone 2: Hand-Drawn Sketch Theme -->
  <g transform="translate(400, 30)">
    <rect x="0" y="0" width="280" height="540" rx="32" fill="#27272a" stroke="#52525b" stroke-width="3" />
    <rect x="90" y="12" width="100" height="14" rx="7" fill="#3f3f46" />

    <!-- Phone Content Area: Warm paper sketch -->
