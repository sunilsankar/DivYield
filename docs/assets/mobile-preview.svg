  <!-- Feature callout card on right -->
  <g transform="translate(710, 60)">
    <rect x="0" y="0" width="260" height="480" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="36" fill="#38bdf8" font-size="15" font-weight="bold">Mobile Highlights</text>
    
    <text x="20" y="70" fill="#f8fafc" font-weight="bold" font-size="12">🔔 Dividend Notifications</text>
    <text x="20" y="88" fill="#94a3b8" font-size="11">Scheduled 9:00 AM local alerts</text>
    <text x="20" y="102" fill="#94a3b8" font-size="11">Supports Android 10 to latest</text>

    <text x="20" y="136" fill="#f8fafc" font-weight="bold" font-size="12">🛡️ Hardware Biometrics</text>
    <text x="20" y="154" fill="#94a3b8" font-size="11">Fingerprint / Face unlock</text>
    <text x="20" y="168" fill="#94a3b8" font-size="11">4-digit PIN fallback</text>

    <text x="20" y="202" fill="#f8fafc" font-weight="bold" font-size="12">📈 Yahoo Finance Sync</text>
    <text x="20" y="220" fill="#94a3b8" font-size="11">Rate-limited on-device sync</text>
    <text x="20" y="234" fill="#94a3b8" font-size="11">12-month forward forecasts</text>

    <text x="20" y="268" fill="#f8fafc" font-weight="bold" font-size="12">🎨 Modern &snip amp; snip Sketch Themes</text>
    <text x="20" y="286" fill="#94a3b8" font-size="11">Material Design 3 &snip amp; snip Hand-drawn</text>

    <text x="20" y="320" fill="#f8fafc" font-weight="bold" font-size="12">💾 Local SQLite &snip amp; snip CSV</text>
    <text x="20" y="338" fill="#94a3b8" font-size="11">100% on-device data</text>
    <text x="20" y="352" fill="#94a3b8" font-size="11">One-tap RFC-4180 CSV export</text>

    <rect x="20" y="410" width="220" height="36" rx="8" fill="#0284c7" />
    <text x="130" y="433" fill="#ffffff" font-weight="bold" font-size="12" text-anchor="middle">Android 10+ Standalone APK</text>
  </g>
