    <text x="30" y="210" fill="#18181b" font-size="12" font-weight="bold">Sector Diversification</text>
    
    <rect x="30" y="226" width="220" height="10" fill="#e4e4e7" stroke="#18181b" stroke-width="1.5" />
    <rect x="30" y="226" width="80" height="10" fill="#2563eb" />
    <rect x="110" y="226" width="65" height="10" fill="#10b981" />
    <rect x="175" y="226" width="40" height="10" fill="#f59e0b" />

    <text x="30" y="256" fill="#18181b" font-size="10" font-weight="bold">• Tech: 36.4% (€15.6k)</text>
    <text x="30" y="274" fill="#18181b" font-size="10" font-weight="bold">• Finance: 29.5% (€12.6k)</text>
    <text x="30" y="292" fill="#18181b" font-size="10" font-weight="bold">• Healthcare: 18.2% (€7.8k)</text>

    <!-- Quick Lock in Sketch theme -->
    <rect x="16" y="334" width="248" height="52" rx="4" fill="#ffffff" stroke="#18181b" stroke-width="2.5" />
    <text x="30" y="356" fill="#18181b" font-size="11" font-weight="bold">🔒 App Lock Active</text>
    <text x="30" y="372" fill="#52525b" font-size="9">Protected by Biometrics &snip amp; snip 4-digit PIN</text>

    <!-- Bottom Nav Sketch -->
    <rect x="8" y="474" width="264" height="50" fill="#f5f0e6" stroke="#18181b" stroke-width="2" />
    <text x="35" y="504" fill="#18181b" font-size="10" font-weight="bold" text-anchor="middle">Home</text>
    <text x="88" y="504" fill="#52525b" font-size="10" text-anchor="middle">Assets</text>
    <text x="140" y="504" fill="#52525b" font-size="10" text-anchor="middle">Calendar</text>
    <text x="194" y="504" fill="#52525b" font-size="10" text-anchor="middle">Sectors</text>
    <text x="245" y="504" fill="#52525b" font-size="10" text-anchor="middle">Settings</text>
