<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0f172a; snip font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;snip ">
