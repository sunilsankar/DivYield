<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0f172a; snip font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;snip ">
  <!-- Desktop Lock Screen Side -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="420" height="520" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="210" cy="90" r="36" fill="#0284c7" fill-opacity="0.2" />
    <text x="210" y="100" fill="#38bdf8" font-size="32" text-anchor="middle">🔒</text>
    <text x="210" y="160" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">DivYield Desktop Locked</text>
    <text x="210" y="185" fill="#94a3b8" font-size="12" text-anchor="middle">Protected by OS Keychain (Windows / macOS)</text>

    <!-- Password input -->
    <rect x="50" y="230" width="320" height="44" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="66" y="258" fill="#f8fafc" font-size="18" letter-spacing="4">••••••••••••</text>

    <!-- Unlock button -->
    <rect x="50" y="294" width="320" height="44" rx="8" fill="#0284c7" />
    <text x="210" y="322" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Unlock Portfolio</text>

    <text x="210" y="380" fill="#64748b" font-size="11" text-anchor="middle">Encrypted in Windows Credential Manager / macOS Keychain</text>
    <text x="210" y="400" fill="#64748b" font-size="11" text-anchor="middle">Zero plaintext passwords in SQLite or filesystem</text>
    
    <rect x="110" y="440" width="200" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="210" y="461" fill="#38bdf8" font-size="12" font-weight="500" text-anchor="middle">Standalone App Security</text>
  </g>

  <!-- Mobile App Biometric / PIN Lock Side -->
  <g transform="translate(530, 40)">
    <rect x="0" y="0" width="420" height="520" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <!-- Phone frame preview inside -->
    <rect x="75" y="20" width="270" height="480" rx="24" fill="#020617" stroke="#475569" stroke-width="2" />
    <rect x="165" y="30" width="90" height="12" rx="6" fill="#1e293b" />
    
    <text x="210" y="90" fill="#38bdf8" font-size="24" text-anchor="middle">🛡️</text>
    <text x="210" y="120" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">DivYield Mobile</text>
    <text x="210" y="140" fill="#94a3b8" font-size="11" text-anchor="middle">Enter 4-Digit Security PIN</text>

    <!-- PIN dots -->
    <circle cx="170" cy="170" r="6" fill="#38bdf8" />
    <circle cx="195" cy="170" r="6" fill="#38bdf8" />
    <circle cx="225" cy="170" r="6" fill="#38bdf8" />
    <circle cx="250" cy="170" r="6" fill="#334155" stroke="#64748b" stroke-width="1" />

    <!-- Numeric Keypad -->
    <g transform="translate(115, 205)" fill="#f8fafc" font-size="16" font-weight="600" text-anchor="middle">
      <!-- Row 1 -->
      <circle cx="30" cy="20" r="20" fill="#1e293b" /><text x="30" y="26">1</text>
      <circle cx="95" cy="20" r="20" fill="#1e293b" /><text x="95" y="26">2</text>
      <circle cx="160" cy="20" r="20" fill="#1e293b" /><text x="160" y="26">3</text>
      <!-- Row 2 -->
      <circle cx="30" cy="70" r="20" fill="#1e293b" /><text x="30" y="76">4</text>
      <circle cx="95" cy="70" r="20" fill="#1e293b" /><text x="95" y="76">5</text>
      <circle cx="160" cy="70" r="20" fill="#1e293b" /><text x="160" y="76">6</text>
      <!-- Row 3 -->
      <circle cx="30" cy="120" r="20" fill="#1e293b" /><text x="30" y="126">7</text>
      <circle cx="95" cy="120" r="20" fill="#1e293b" /><text x="95" y="126">8</text>
      <circle cx="160" cy="120" r="20" fill="#1e293b" /><text x="160" y="126">9</text>
      <!-- Row 4 -->
      <circle cx="30" cy="170" r="20" fill="#0284c7" fill-opacity="0.3" /><text x="30" y="176" font-size="16">👆</text>
      <circle cx="95" cy="170" r="20" fill="#1e293b" /><text x="95" y="176">0</text>
      <circle cx="160" cy="170" r="20" fill="#1e293b" /><text x="160" y="175" font-size="14">⌫</text>
    </g>

    <text x="210" y="435" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Touch Fingerprint to Unlock</text>
    <text x="210" y="455" fill="#64748b" font-size="10" text-anchor="middle">Hardware Keystore • Android 10 to Latest</text>
  </g>
</svg>