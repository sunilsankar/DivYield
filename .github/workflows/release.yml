name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          
      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Install Python Security Tools
        run: pip install bandit pip-audit
        
      - name: Run Bandit (Python SAST)
        run: bandit -r backend/app/ -ll
        
      - name: Run pip-audit (Python Dependencies)
        run: pip-audit -r backend/requirements.txt
        
      - name: Run npm audit (Frontend Dependencies)
        working-directory: ./frontend
        run: npm audit --audit-level=high

  test:
    name: Test Suites (Backend & Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install anyio pytest-asyncio

      - name: Run Backend Tests (pytest)
        run: pytest backend/tests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests (vitest)
        working-directory: ./frontend
        run: npm test -- --run

      - name: Run Frontend Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

  build-desktop:
    name: Build & Release Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            artifact_name: DivYield-macOS-AppleSilicon.dmg
          - os: windows-latest
            platform: windows-x64
            artifact_name: DivYield-Windows.msi
      # ponytail: serialize release uploads to avoid GitHub release API races; split build/publish jobs if throughput matters.
      max-parallel: 1
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller
          
      - name: Build with PyInstaller
        run: pyinstaller DivYield.spec --clean
        
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d "dist/DivYield.app" ]; then
            hdiutil create -volname "DivYield" -srcfolder "dist/DivYield.app" -ov -format UDZO "${{ matrix.artifact_name }}"
          fi
          
      - name: Build Windows MSI (WiX Toolset)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # 1. Create self-signed code-signing certificate for binary authenticity
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=DivYield, O=DivYield" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
          $certPassword = ConvertTo-SecureString -String "DivYieldSigningKey2026" -Force -AsPlainText
          $certPath = "$pwd\DivYieldCert.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $certPath -Password $certPassword

          # Locate signtool in Windows SDK
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          if (-not $signtool) {
              $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }

          if ($signtool -and (Test-Path "dist\DivYield\DivYield.exe")) {
              Write-Host "Signing DivYield.exe with $signtool..."
              & $signtool sign /f $certPath /p "DivYieldSigningKey2026" /fd SHA256 "dist\DivYield\DivYield.exe"
          }

          # 2. Ensure WiX toolset is in PATH
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $wixPath) {
              $env:PATH = "$wixPath;$env:PATH"
          } else {
              choco install wixtoolset -y
              $env:PATH = "C:\Program Files (x86)\WiX Toolset v3.11\bin;$env:PATH"
          }

          # 3. Harvest files from PyInstaller dist
          heat dir "dist\DivYield" -cg DivYieldComponents -dr INSTALLFOLDER -scom -sreg -srd -var var.SourceDir -gg -out "dist\HarvestedComponents.wxs"

          # 4. Compile WiX sources
          candle -dSourceDir="dist\DivYield" -out "dist\" wix\Product.wxs dist\HarvestedComponents.wxs

          # 5. Link MSI installer with WixUI_InstallDir dialogs
          light -ext WixUIExtension -sice:ICE38 -sice:ICE43 -sice:ICE69 -sice:ICE91 -out "DivYield-Windows.msi" dist\Product.wixobj dist\HarvestedComponents.wixobj

          # 6. Sign the MSI installer
          if ($signtool -and (Test-Path "DivYield-Windows.msi")) {
              Write-Host "Signing DivYield-Windows.msi with $signtool..."
              & $signtool sign /f $certPath /p "DivYieldSigningKey2026" /fd SHA256 "DivYield-Windows.msi"
          }

          # Clean up certificate file
          if (Test-Path $certPath) {
              Remove-Item -Force $certPath
          }

          # Also create portable zip archive as optional backup
          Compress-Archive -Path dist/DivYield/* -DestinationPath DivYield-Windows.zip

      - name: Publish Desktop Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DivYield ${{ github.ref_name }}
          prerelease: true
          files: |
            DivYield-*.dmg
            DivYield-Windows.msi
            DivYield-Windows.zip

  build-android:
    name: Build & Release Android APK
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Ensure React Native Gradle Plugin Integrity
        working-directory: ./mobile
        run: |
          if [ ! -f "node_modules/@react-native/gradle-plugin/settings.gradle.kts" ]; then
            curl -sL https://registry.npmjs.org/@react-native/gradle-plugin/-/gradle-plugin-0.86.3.tgz | tar -xzf - --strip-components=1 -C node_modules/@react-native/gradle-plugin
          fi

      - name: Prebuild Native Android Project
        working-directory: ./mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build Android Release APK
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon --parallel -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Prepare APK Asset
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk DivYield-Android.apk

      - name: Publish Android Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DivYield ${{ github.ref_name }}
          prerelease: true
          files: DivYield-Android.apk
