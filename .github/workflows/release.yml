name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          
      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Install Python Security Tools
        run: pip install bandit pip-audit
        
      - name: Run Bandit (Python SAST)
        run: bandit -r backend/app/ -ll
        
      - name: Run pip-audit (Python Dependencies)
        run: pip-audit -r backend/requirements.txt
        
      - name: Run npm audit (Frontend Dependencies)
        working-directory: ./frontend
        run: npm audit --audit-level=high

  test:
    name: Test Suites (Backend & Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install anyio pytest-asyncio

      - name: Run Backend Tests (pytest)
        run: pytest backend/tests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests (vitest)
        working-directory: ./frontend
        run: npm test -- --run

      - name: Run Frontend Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

  build:
    name: Build DivYield (${{ matrix.platform }})
    needs: [security-scan, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            artifact_name: DivYield-macOS-AppleSilicon.dmg
          - os: macos-13
            platform: macos-x86_64
            artifact_name: DivYield-macOS-Intel.dmg
          - os: windows-latest
            platform: windows-x64
            artifact_name: DivYield-Windows.msi
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller
          
      - name: Build with PyInstaller
        run: pyinstaller DivYield.spec --clean
        
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d "dist/DivYield.app" ]; then
            hdiutil create -volname "DivYield" -srcfolder "dist/DivYield.app" -ov -format UDZO "${{ matrix.artifact_name }}"
          fi
          
      - name: Build Windows MSI (WiX Toolset)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Ensure WiX toolset is in PATH
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $wixPath) {
              $env:PATH = "$wixPath;$env:PATH"
          } else {
              choco install wixtoolset -y
              $env:PATH = "C:\Program Files (x86)\WiX Toolset v3.11\bin;$env:PATH"
          }

          # 1. Harvest files from PyInstaller dist
          heat dir "dist\DivYield" -cg DivYieldComponents -dr INSTALLFOLDER -scom -sreg -srd -var var.SourceDir -gg -out "dist\HarvestedComponents.wxs"

          # 2. Compile WiX sources
          candle -dSourceDir="dist\DivYield" -out "dist\" wix\Product.wxs dist\HarvestedComponents.wxs

          # 3. Link MSI installer
          light -ext WixUIExtension -sice:ICE69 -sice:ICE91 -out "DivYield-Windows.msi" dist\Product.wixobj dist\HarvestedComponents.wixobj

          # Also create portable zip archive as optional backup
          Compress-Archive -Path dist/DivYield/* -DestinationPath DivYield-Windows.zip
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: divyield-${{ matrix.platform }}
          path: |
            DivYield-*.dmg
            DivYield-Windows.msi
            DivYield-Windows.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: divyield-*
          merge-multiple: true
          
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: DivYield ${{ github.ref_name }}
          prerelease: true
          files: |
            DivYield-macOS-AppleSilicon.dmg
            DivYield-macOS-Intel.dmg
            DivYield-Windows.msi
            DivYield-Windows.zip
          draft: false
          generate_release_notes: true
