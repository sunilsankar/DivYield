name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Run Gitleaks (Secrets Scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Install Python Security Tools
        run: pip install bandit pip-audit
        
      - name: Run Bandit (Python SAST)
        run: bandit -r backend/app/ -ll
        
      - name: Run pip-audit (Python Dependencies)
        run: pip-audit -r backend/requirements.txt
        
      - name: Run npm audit (Frontend Dependencies)
        working-directory: ./frontend
        run: npm audit --audit-level=high

  build:
    name: Build DivYield
    needs: security-scan
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller
          
      - name: Build with PyInstaller
        run: pyinstaller DivYield.spec --clean
        
      - name: Create DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          npm install -g create-dmg
          create-dmg "dist/DivYield.app" || true
          mv *.dmg DivYield-macOS.dmg
          
      - name: Zip Windows Build
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path dist/DivYield/* -DestinationPath DivYield-Windows.zip
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: divyield-${{ matrix.os }}
          path: |
            DivYield-macOS.dmg
            DivYield-Windows.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: divyield-*
          merge-multiple: true
          
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DivYield-macOS.dmg
            DivYield-Windows.zip
          draft: false
          generate_release_notes: true
